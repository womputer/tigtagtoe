services:
  - type: web
    name: tigtagtoe-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      # SQLite lives inside the container on the free tier. It is ephemeral:
      # when Render restarts the service (idle timeout, redeploy, etc) the
      # database resets. Reviewers just re-upload the sample CSV. Swap to
      # Postgres by changing this value to a postgresql+psycopg URL.
      - key: DATABASE_URL
        value: sqlite:///./tigtagtoe.db
      # Allow the production Vercel frontend (and local Vite) by default.
      # Override if you use a preview/custom domain.
      - key: CORS_ORIGINS
        value: https://tigtagtoe.vercel.app,http://localhost:5173
      - key: AGENT_CONCURRENCY
        value: "5"
      - key: MAX_EMAILS_PER_RUN
        value: "300"
      - key: MAX_BODY_CHARS
        value: "4000"
