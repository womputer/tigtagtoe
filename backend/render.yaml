services:
  - type: web
    name: tigtagtoe-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: DATABASE_URL
        value: sqlite:////var/data/tigtagtoe.db
      - key: CORS_ORIGINS
        sync: false
      - key: AGENT_CONCURRENCY
        value: "5"
      - key: MAX_EMAILS_PER_RUN
        value: "300"
      - key: MAX_BODY_CHARS
        value: "4000"
    disk:
      name: tigtagtoe-data
      mountPath: /var/data
      sizeGB: 1
